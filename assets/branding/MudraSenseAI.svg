<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 150" width="100%" height="100%">
  <defs>
    <linearGradient id="agentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="540" height="150" fill="#090D16" rx="16" />

  <!-- Logo Icon: Multi-Agent Neural Network / Trend Intelligence Grid -->
  <g transform="translate(25, 25)">
    <!-- Outer Network Ring -->
    <circle cx="50" cy="50" r="45" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Interconnected Agent Nodes -->
    <!-- Lines connecting agents -->
    <line x1="50" y1="20" x2="25" y2="65" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6" />
    <line x1="50" y1="20" x2="75" y2="65" stroke="url(#agentGradient)" stroke-width="1.5" opacity="0.6" />
    <line x1="25" y1="65" x2="75" y2="65" stroke="#334155" stroke-width="1.5" />
    <line x1="50" y1="20" x2="50" y2="85" stroke="url(#accentGradient)" stroke-width="2" />

    <!-- Trend Arrow / Insight Vector moving upward through the agents -->
    <path d="M 25 75 L 50 45 L 75 35" fill="none" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Agent Nodes (Representing autonomous analysis agents) -->
    <circle cx="50" cy="20" r="5" fill="#3b82f6" />
    <circle cx="25" cy="65" r="5" fill="#06b6d4" />
    <circle cx="75" cy="65" r="5" fill="#8b5cf6" />
    <circle cx="50" cy="85" r="6" fill="#a855f7" />
    
    <!-- Core Intelligence Hub -->
    <circle cx="50" cy="50" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typography: MudraSenseAI -->
  <text x="140" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">
    Mudra<tspan fill="url(#accentGradient)">Sense</tspan><tspan fill="#a855f7">AI</tspan>
  </text>
  
  <text x="140" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="4.5" fill="#64748B">
    AGENTIC MARKET INTELLIGENCE
  </text>
</svg>
